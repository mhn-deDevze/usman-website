<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80" style="background:transparent;display:block;">
  <defs>
    <!-- Background Gradient for Icon Shield -->
    <linearGradient id="shieldGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091729" />
      <stop offset="60%" stop-color="#0f294a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Vibrant Cyan Water Gradient -->
    <linearGradient id="cyanAccEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (62x62) -->
  <g transform="translate(6, 9)">
    <!-- Base Rounded Shield -->
    <rect x="0" y="0" width="62" height="62" rx="16" fill="url(#shieldGradEn)" />
    <!-- Inset Golden Precision Border -->
    <rect x="1.5" y="1.5" width="59" height="59" rx="14.5" fill="none" stroke="url(#goldAccEn)" stroke-width="1.8" opacity="0.9" />
    
    <!-- Stylized Architectural Gateway Arch -->
    <path d="M 16 50 L 16 28 C 16 17, 46 17, 46 28 L 46 50" fill="none" stroke="url(#goldAccEn)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Water Droplet for Plumbing -->
    <path d="M 31 23 C 31 23, 22 35, 22 40.5 C 22 45.5, 26 49, 31 49 C 36 49, 40 45.5, 40 40.5 C 40 35, 31 23, 31 23 Z" fill="url(#cyanAccEn)" />
    
    <!-- High-Voltage Energy Lightning Bolt -->
    <polygon points="33,26 25,38 32,38 29,48 39,35 32.5,35" fill="#fbbf24" stroke="#d97706" stroke-width="0.6" />
    
    <!-- Decorative Sparkle Point -->
    <circle cx="31" cy="14" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Typography Group (English) -->
  <g direction="ltr" style="text-anchor:start;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
    <!-- Main Business Name -->
    <text x="82" y="37" font-size="21" font-weight="900" fill="#091729" letter-spacing="-0.3">BAWABAT GARNADA</text>
    
    <!-- Tagline & Services Category Badges -->
    <text x="82" y="59" font-size="11.5" font-weight="800" fill="#d97706" letter-spacing="0.3">PLUMBING &bull; ELECTRICAL &bull; PAINTING &bull; RIYADH</text>
  </g>
</svg>
