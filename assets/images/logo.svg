<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 80" width="100%" height="100%" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2e" />
      <stop offset="100%" stop-color="#142c4d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#08182b" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Brand Emblem (Gate Arch + Water Drop + Lightning Bolt + Wrench Accents) -->
  <g transform="translate(6, 8)" filter="url(#logoShadow)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#bgGrad)"/>
    <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    
    <!-- Granada Archway (بوابة) -->
    <path d="M18 50 V28 Q32 14 46 28 V50" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Water Drop (سباكة) -->
    <path d="M32 24 C32 24 24 35 24 40 A8 8 0 0 0 40 40 C40 35 32 24 32 24 Z" fill="url(#blueGrad)" opacity="0.95"/>
    
    <!-- Lightning Bolt (كهرباء) -->
    <polygon points="34,26 27,38 33,38 30,48 39,36 33,36" fill="#fef08a"/>

    <!-- Small Spark Dot -->
    <circle cx="32" cy="18" r="2" fill="#fbbf24"/>
  </g>

  <!-- Arabic Typography -->
  <g transform="translate(82, 0)">
    <text x="0" y="36" font-family="'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="900" fill="#0b1a2e" letter-spacing="-0.3">
      مؤسسة بوابة غرناطة
    </text>
    <text x="0" y="62" font-family="'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif" font-size="14.5" font-weight="800" fill="#d97706" letter-spacing="-0.2">
      للسباكة والكهرباء والدهانات بالرياض
    </text>
  </g>
</svg>
